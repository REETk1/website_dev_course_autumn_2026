<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop 5</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="body">
    <header>
      <div class="header">
        <h1>Welcome to Workshop 5</h1>
      </div>
    </header>

    <main>
      <nav class="responsive-nav">
        <button class="menu-toggle">☰ Menu</button>
        <ul class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <section class="about">
        <h2>About Workshop 5</h2>
        <p>
          This workshop focuses on basics of responsive web design using media
          queries, flexible layouts, and responsive images.
        </p>
      </section>

      <img
        src="vizslafotozas-dog-3277416_1920.jpg"
        alt="dog"
        class="responsive-image"
      />
    </main>

    <div class="media-query-box">Resize to see effects</div>

    <div class="responsive-container">
      <div class="col-left">Column 1</div>
      <div class="col-right">Column 2</div>
    </div>

    <script>
      const btn = document.querySelector(".menu-toggle");
      const list = document.querySelector(".nav-list");

      btn.addEventListener("click", () => {
        list.classList.toggle("active");
      });
    </script>
  </body>
</html>
